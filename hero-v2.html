<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script>document.documentElement.classList.add('js');</script>

  <title>Hero v2 &mdash; LimpioZam</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" href="assets/images/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <!-- The v2 copy only. hero.css is deliberately not loaded here. -->
  <link rel="stylesheet" href="css/sections/hero-v2.css" />

  <style>
    /* Sandbox only: a scroll runway so the hero's pinned exit can be driven,
       and a marker for where the next section would begin. */
    .sandbox-next {
      display: grid;
      place-items: center;
      min-height: 100svh;
      /* Stands in for "What Makes Us Different", which now wears the colour
         the squeegee head spreads into. */
      background-color: #ff712d;
      padding: 0 8vw;
      font-family: 'Poppins', sans-serif;
      color: #f9f6ef;
      text-align: center;
    }

    .sandbox-next p:first-child {
      font-weight: 700;
      font-size: clamp(28px, 3.6vw, 48px);
      line-height: 1.2;
    }

    .sandbox-next p:last-child {
      margin-top: 1.2em;
      font-size: clamp(15px, 1.4vw, 19px);
      line-height: 1.5;
      opacity: 0.85;
      max-width: 46ch;
      margin-inline: auto;
    }
  </style>
</head>

<body>

  <!-- HERO v2 - edit this copy freely -->
  <section class="hero" id="hero">

    <header class="site-header">
      <a class="site-header__logo" href="#hero" aria-label="LimpioZam Cleaning Services, back to top" data-anim>
        <img src="assets/images/logo.png" alt="" width="512" height="512" />
      </a>
    </header>

    <div class="hero__inner">
      <h1 class="hero__title" data-anim>THE BEST <em>CLEANING</em> SERVICES IN ZAMBOANGA CITY</h1>

      <p class="hero__subtitle" data-anim>Quality, reliability, and customer satisfaction are our priority.</p>

      <div class="hero__actions" data-anim>
        <a class="hero__cta" href="#contact">Contact Us</a>
      </div>
    </div>

    <div class="squeegee" aria-hidden="true">
      <div class="squeegee__part squeegee__head"></div>
      <div class="squeegee__part squeegee__lip"></div>
    </div>

  </section>

  <main>
    <section class="sandbox-next">
      <div>
        <p>What Makes Us Different</p>
        <p>Stand-in for section two. Its background is the colour the squeegee
          head spreads into, so the wipe carries straight through.</p>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>

  <script type="module" src="js/main-hero-v2.js"></script>

</body>
</html>
